# =============================================================================
# dunenv configuration
#   Edit by hand ("dunenv edit") or with  dunenv set / add / rm / pkg.
#   Comments must be on their own line. A value continues on the next lines
#   when those lines are indented (used for package lists).
#   ${USER} and ${HOME} are expanded.
# =============================================================================

[defaults]
# dunesw release used when the chosen environment does not fix one
# (a local MRB environment always uses the release it was built with).
version   = v10_17_01d00
qualifier = e26:prof

# Environment used when none is named: "none" = dunesw + packages only.
env = none

# Token + JUSTIN + Rucio block at the end of setup (yes/no).
# Turn off for one run with --no-grid.
grid = yes

# Folder to cd into when setup is finished (empty = stay where you are).
workdir = /exp/dune/app/users/${USER}

# UPS products set up after dunesw, one per line, written exactly as you
# would type them after "setup". {version} and {qualifier} are replaced by
# the active dunesw release, e.g.
#     duneprototypes {version} -q {qualifier}
#     larsoft v10_17_01 -q e26:prof
# Add one for a single run with:  -p "name version -q qual"
# Add one permanently with:       dunenv pkg add "name version -q qual"
packages =
    metacat
    rucio
    justin

# UPS bootstrap and the personal profile sourced at the end of setup.
ups_setup = /cvmfs/dune.opensciencegrid.org/products/dune/setup_dune.sh
profile   = ${HOME}/.bash_profile

[exports]
# Exported before the UPS bootstrap. NAME = value
UPS_OVERRIDE            = -H Linux64bit+3.10-2.17
IFDH_CP_MAXRETRIES      = 0
METACAT_SERVER_URL      = https://metacat.fnal.gov:9443/dune_meta_prod/app
METACAT_AUTH_SERVER_URL = https://metacat.fnal.gov:8143/auth/dune
X509_CERT_DIR           = /cvmfs/oasis.opensciencegrid.org/mis/certificates

[grid]
token_cmd     = htgettoken -a htvaultprod.fnal.gov -i dune
rucio_account = justinreadonly

[container]
apptainer   = /cvmfs/oasis.opensciencegrid.org/mis/apptainer/current/bin/apptainer
image       = /cvmfs/singularity.opensciencegrid.org/fermilab/fnal-dev-sl7:latest
# normal container (has /pnfs/dune for data access)
binds       = /cvmfs,/exp,/nashome,/pnfs/dune,/opt,/run/user,/etc/hostname,/etc/hosts,/etc/krb5.conf
# "build" container (same list without /pnfs/dune)
build_binds = /cvmfs,/exp,/nashome,/opt,/run/user,/etc/hostname,/etc/hosts,/etc/krb5.conf

[newdev]
# Used by "dunenv new NAME AREA -v VERSION" to create + build a new MRB area.
# "project" and "packages" are separate settings. Here both say protoduneana only
# because the area is named after the package it builds:
#   project  = only a NAME for the whole area: MRB_PROJECT and the folder
#              localProducts_<project>_<version>_<qual>. Checks out nothing.
#   packages = code repositories checked out into srcs/ and compiled.
# MRB project name; --project overrides.
project = protoduneana
# Packages checked out with "mrb g -t <version>", in this order; -p overrides
# (repeat -p for several, e.g. -p protoduneana -p duneprototypes).
# Each one must have the tag <version> on repo_url below, i.e. a DUNE package
# with the same version as dunesw. Candidates for a release:
#   ups depend dunesw <version> -q <qual> | grep -oE "__[a-z_0-9]+ <version>" | sed 's/^__//' | sort -u
# LArSoft packages (larreco, ...) have other versions: check out by hand after --no-build.
# Default: only protoduneana (it then uses the dunereco installed with dunesw).
# Add more here or per run with -p. Note: protoduneana v10_26_00d05 needs
# dunereco at build time but does not declare it in ups/product_deps, so with
# both checked out, add "dunereco <version>" to that file and run "mrb uc".
packages =
    protoduneana
# Parallel build jobs (mrb i -j N); -j overrides.
jobs = 20
# The build step only runs on machines matching one of these patterns
# (space separated, * and ? allowed). Never on the dunegpvms.
build_hosts = dunebuild*.fnal.gov
# Where the tags are checked before anything is created ({package} is replaced).
repo_url = https://github.com/DUNE/{package}.git

# =============================================================================
# Local MRB environments - one [env:<name>] section each.
#   area      MRB top folder holding localProducts_<project>_<version>_<qual>
#   desc      one line shown by "dunenv list" and the menu
#   packages  extra UPS products for this environment only (same format)
#   after     extra shell lines run after mrbslp (indented, one per line)
#   version / qualifier   only needed when the area holds several
#                         localProducts_* folders, to pick one
# The dunesw release is read from the localProducts_* folder name.
# New environment:  dunenv add <name> <area> [--desc "..."]
# =============================================================================

[env:pana]
desc = Local protoduneana (single-particle LArSoft modules)
area = /exp/dune/app/users/jairorod/protoDUNE/larmodule_singlep_protoduneana

[env:nbana]
desc = MRB protoduneana: protoduneana at v10_26_00d05 -q e26:prof
area = /exp/dune/app/users/jairorod/protoDUNE/larmodule_neutron_blip_protoduneana
